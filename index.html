<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traduttore Live CPIA Pro</title>
  <!-- LIBRERIE ONLINE PER RETE E QR CODE (SENZA INSTALLAZIONE) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #202124;
      --border-color: #dadce0;
      --card-body-bg: #f8f9fa;
      --primary-color: #1a73e8;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e8eaed;
      --border-color: #3c4043;
      --card-body-bg: #2d2d2d;
      --primary-color: #8ab4f8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 14px;
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 22px;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-bar {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2px 8px;
    }
    .btn-tool {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .btn-tool:hover { background: var(--border-color); }
    .status {
      font-size: 13px;
      color: #5f6368;
      font-weight: bold;
      padding: 4px 10px;
      background: #e8eaed;
      border-radius: 16px;
    }
    
    .source-box {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    label {
      font-weight: bold;
      color: var(--text-color);
      font-size: 15px;
    }
    .action-btns {
      display: flex;
      gap: 8px;
    }
    .btn-main {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    body.dark-mode .btn-main { color: #121212; }
    .btn-main:hover { opacity: 0.9; }
    .btn-main.recording {
      background-color: #d93025 !important;
      color: white !important;
      animation: pulse 1.5s infinite;
    }
    .btn-clear {
      background-color: #f1f3f4;
      color: #5f6368;
      border: 1px solid var(--border-color);
    }
    .btn-save {
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }
    .btn-student {
      background-color: #fef7e0;
      color: #b06000;
      border: 1px solid #feefc3;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(217, 48, 37, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
    }
    
    textarea {
      width: 100%;
      height: 80px;
      padding: 8px 10px;
      font-size: 18px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      resize: vertical;
      outline: none;
      background: var(--card-bg);
      color: var(--text-color);
    }
    textarea:focus { border-color: var(--primary-color); }

    /* TRADUZIONE INVERSA */
    .student-panel {
      display: none;
      background: #fef7e0;
      border: 2px solid #f9ab00;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    body.dark-mode .student-panel {
      background: #3c2f00;
      border-color: #f9ab00;
    }
    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .student-select {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid #f9ab00;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      flex-grow: 1;
      overflow-y: auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-top: 4px solid var(--primary-color);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 160px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-title {
      font-weight: bold;
      font-size: 16px;
      color: var(--primary-color);
    }
    .card-body {
      background-color: var(--card-body-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      font-size: 16px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      flex-grow: 1;
      overflow-y: auto;
      color: var(--text-color);
    }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 6px;
    }
    .btn-card {
      background-color: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #d2e3fc;
      border-radius: 14px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .btn-card:hover {
      background-color: var(--primary-color);
      color: white;
    }
    .rtl { direction: rtl; text-align: right; }

    /* MODALE FOCUS, GESTIONE LINGUE E QR CODE */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border-top: 8px solid var(--primary-color);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title { font-size: 24px; font-weight: bold; color: var(--primary-color); }
    .modal-body {
      font-size: 28px;
      line-height: 1.4;
      background: var(--card-body-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex-grow: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      color: var(--text-color);
    }
    .lang-grid-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 10px;
      background: var(--card-body-bg);
      border-radius: 8px;
    }
    .lang-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎙️ Traduttore Live CPIA Pro</h1>
    <div class="top-controls">
      <button class="btn-main" onclick="mostraQRCode()">📱 Trasmetti agli Studenti</button>
      <button class="btn-tool" onclick="apriGestioneLingue()">⚙️ Gestisci Lingue</button>
      <button class="btn-tool" onclick="toggleDarkMode()">🌙 Alto Contrasto</button>
      <div class="zoom-bar">
        <span style="font-size: 12px; color: #5f6368; margin-right: 4px;">Testo:</span>
        <button class="btn-tool" onclick="cambiaZoom(-2)">A-</button>
        <button class="btn-tool" onclick="resetZoom()">A</button>
        <button class="btn-tool" onclick="cambiaZoom(2)">A+</button>
      </div>
      <button class="btn-main btn-save" onclick="scaricaLezione()">📥 Scarica Lezione</button>
      <span id="status" class="status">Pronto</span>
    </div>
  </div>

  <!-- TRADUZIONE INVERSA -->
  <div id="studentPanel" class="student-panel">
    <div class="student-header">
      <label>🗣️ <strong>Modalità Studente:</strong> Parla nella tua lingua ➔ Il docente leggerà la traduzione in italiano</label>
      <div>
        <select id="studentLangSelect" class="student-select"></select>
        <button id="btnMicStudent" class="btn-main" onclick="toggleMicrofonoStudente()">🎙️ Parla (Studente)</button>
        <button class="btn-tool" onclick="chiudiModalitaStudente()">✖️ Chiudi</button>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <textarea id="testoStudente" placeholder="Trascrizione e traduzione per il docente..." style="height: 60px;"></textarea>
    </div>
  </div>

  <div class="source-box">
    <div class="label-row">
      <label for="testoITA">🇮🇹 Parla o Scrivi in Italiano (Docente):</label>
      <div class="action-btns">
        <button class="btn-main btn-student" onclick="apriModalitaStudente()">🔄 Studente ➔ Docente</button>
        <button class="btn-main btn-clear" onclick="cancellaTutto()">🗑️ Cancella</button>
        <button class="btn-main btn-save" onclick="salvaInCronologia()">📌 Salva Frase</button>
        <button id="btnMic" class="btn-main" onclick="toggleMicrofonoDocente()">
          <span id="micIcon">🎙️</span> <span id="micText">Attiva Mic</span>
        </button>
      </div>
    </div>
    <textarea id="testoITA" placeholder="Scrivi o premi il pulsante per parlare..." oninput="registraModificaManuale()"></textarea>
  </div>

  <!-- GRIGLIA LINGUE -->
  <div id="gridContainer" class="grid-container"></div>

  <!-- MODALE FOCUS -->
  <div id="modalFocus" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modalTitle" class="modal-title">Lingua</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn-main" onclick="leggiTestoFocus(0.5)">🐢 Lento</button>
          <button class="btn-main" onclick="leggiTestoFocus(0.9)">🔊 Ascolta</button>
          <button class="btn-main btn-clear" onclick="chiudiFocus()">✖️ Chiudi</button>
        </div>
      </div>
      <div id="modalBody" class="modal-body">...</div>
    </div>
  </div>

  <!-- MODALE GESTIONE LINGUE -->
  <div id="modalLangConfig" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">⚙️ Seleziona le Lingue della Classe</span>
        <button class="btn-main btn-clear" onclick="chiudiGestioneLingue()">✖️ Chiudi e Salva</button>
      </div>
      <p style="margin: 0 0 10px 0; color: #5f6368; font-size: 14px;">Spunta le lingue che desideri visualizzare sulla LIM:</p>
      <div id="langSelectorList" class="lang-grid-selector"></div>
    </div>
  </div>

  <!-- MODALE QR CODE STUDENTI -->
  <div id="modalQR" class="modal-overlay">
    <div class="modal-card" style="align-items: center; text-align: center; max-width: 450px;">
      <h2 style="margin-top:0; color: var(--primary-color);">📱 Connetti gli Studenti</h2>
      <p style="font-size: 14px; color: #5f6368;">Gli studenti possono inquadrare questo QR Code per vedere le traduzioni in tempo reale sui loro dispositivi:</p>
      <div id="qrcode" style="margin: 15px auto; padding: 10px; background: white; border-radius: 8px;"></div>
      <p style="font-weight: bold; font-size: 14px;">Codice Stanza: <span id="roomCodeDisplay" style="color: #d93025;">...</span></p>
      <button class="btn-main" onclick="chiudiQRCode()">Chiudi</button>
    </div>
  </div>

  <script>
    let timerDebounce = null;
    let abortController = null;
    let fontSizeCorrente = 16;
    let linguaFocusCorrente = null;
    let cronologiaLezione = [];
    let testoConfermatoDocente = '';

    // GESTIONE RETE PEERJS (STREAMING LIVE SENZA SERVER)
    let peer = null;
    let connessioniStudenti = [];
    let ID_STANZA_DOCENTE = 'cpia-aula-' + Math.floor(1000 + Math.random() * 9000);

    const ELENCO_LINGUE = [
      { code: 'en', voice: 'en-US', name: '🇬🇧 Inglese' },
      { code: 'fr', voice: 'fr-FR', name: '🇫🇷 Francese' },
      { code: 'es', voice: 'es-ES', name: '🇪🇸 Spagnolo' },
      { code: 'bn', voice: 'bn-BD', name: '🇧🇩 Bengalese' },
      { code: 'ar', voice: 'ar-SA', name: '🇸🇦 Arabo', rtl: true },
      { code: 'zh', voice: 'zh-CN', name: '🇨🇳 Cinese' },
      { code: 'sq', voice: 'sq-AL', name: '🇦🇱 Albanese' },
      { code: 'uk', voice: 'uk-UA', name: '🇺🇦 Ucraino' },
      { code: 'ro', voice: 'ro-RO', name: '🇷🇴 Rumeno' },
      { code: 'ur', voice: 'ur-PK', name: '🇵🇰 Urdu', rtl: true },
      { code: 'ps', voice: 'ps-AF', name: '🇦🇫 Pashto', rtl: true },
      { code: 'fa', voice: 'fa-IR', name: '🇮🇷 Farsi', rtl: true },
      { code: 'pt', voice: 'pt-PT', name: '🇵🇹 Portoghese' },
      { code: 'ru', voice: 'ru-RU', name: '🇷🇺 Russo' },
      { code: 'de', voice: 'de-DE', name: '🇩🇪 Tedesco' },
      { code: 'tl', voice: 'tl-PH', name: '🇵🇭 Tagalog' },
      { code: 'ti', voice: 'ti-ET', name: '🇪🇷 Tigrino' },
      { code: 'hi', voice: 'hi-IN', name: '🇮🇳 Hindi' }
    ];

    let lingueAttive = JSON.parse(localStorage.getItem('cpia_lingue_attive')) || ['en', 'fr', 'es', 'bn', 'ar', 'zh', 'sq', 'uk'];

    // INIZIALIZZAZIONE RETE
    function inizializzaRete() {
      const urlParams = new URLSearchParams(window.location.search);
      const stanzaTarget = urlParams.get('stanza');

      if (stanzaTarget) {
        // MODALITÀ RICEVENTE (STUDENTE)
        peer = new Peer();
        peer.on('open', () => {
          const conn = peer.connect(stanzaTarget);
          conn.on('data', (dati) => applicaDatiRicevuti(dati));
          aggiornaStato('Connesso alla lezione');
        });
      } else {
        // MODALITÀ TRASMETTITORE (DOCENTE)
        peer = new Peer(ID_STANZA_DOCENTE);
        peer.on('connection', (conn) => {
          connessioniStudenti.push(conn);
          aggiornaStato(`Studenti connessi: ${connessioniStudenti.length}`);
        });
      }
    }

    function trasmettiDatiRete(dati) {
      connessioniStudenti.forEach(conn => {
        if (conn.open) conn.send(dati);
      });
    }

    function applicaDatiRicevuti(dati) {
      document.getElementById('testoITA').value = dati.ita;
      for (const [lang, testo] of Object.entries(dati.traduzioni)) {
        const el = document.getElementById('box_' + lang);
        if (el) el.innerText = testo;
      }
    }

    function mostraQRCode() {
      const modal = document.getElementById('modalQR');
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      document.getElementById('roomCodeDisplay').innerText = ID_STANZA_DOCENTE;

      const urlLezione = window.location.href.split('?')[0] + '?stanza=' + ID_STANZA_DOCENTE;

      new QRCode(container, {
        text: urlLezione,
        width: 200,
        height: 200
      });

      modal.style.display = 'flex';
    }

    function chiudiQRCode() {
      document.getElementById('modalQR').style.display = 'none';
    }

    function inizializzaGriglia() {
      const container = document.getElementById('gridContainer');
      const studentSelect = document.getElementById('studentLangSelect');
      container.innerHTML = '';
      studentSelect.innerHTML = '';

      ELENCO_LINGUE.filter(l => lingueAttive.includes(l.code)).forEach(l => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${l.name}</span>
            <button class="btn-tool" onclick="apriFocus('${l.code}', '${l.name}')">🔍 Espandi</button>
          </div>
          <div id="box_${l.code}" class="card-body ${l.rtl ? 'rtl' : ''}">...</div>
          <div class="card-footer">
            <button class="btn-card" onclick="copiaTesto('${l.code}')">📋 Copia</button>
            <button class="btn-card" onclick="leggiTesto('${l.code}', 0.5)">🐢 Lento</button>
            <button class="btn-card" onclick="leggiTesto('${l.code}', 0.9)">🔊 Ascolta</button>
          </div>
        `;
        container.appendChild(card);

        const opt = document.createElement('option');
        opt.value = l.voice;
        opt.innerText = l.name;
        studentSelect.appendChild(opt);
      });

      gestisciInput();
    }

    function apriGestioneLingue() {
      const list = document.getElementById('langSelectorList');
      list.innerHTML = '';
      ELENCO_LINGUE.forEach(l => {
        const item = document.createElement('label');
        item.className = 'lang-item';
        const checked = lingueAttive.includes(l.code) ? 'checked' : '';
        item.innerHTML = `<input type="checkbox" value="${l.code}" ${checked} onchange="toggleLingua('${l.code}')"> ${l.name}`;
        list.appendChild(item);
      });
      document.getElementById('modalLangConfig').style.display = 'flex';
    }

    function toggleLingua(code) {
      if (lingueAttive.includes(code)) {
        if (lingueAttive.length <= 1) {
          alert("Devi mantenere almeno una lingua attiva.");
          return;
        }
        lingueAttive = lingueAttive.filter(c => c !== code);
      } else {
        lingueAttive.push(code);
      }
      localStorage.setItem('cpia_lingue_attive', JSON.stringify(lingueAttive));
    }

    function chiudiGestioneLingue() {
      document.getElementById('modalLangConfig').style.display = 'none';
      inizializzaGriglia();
    }

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    function cambiaZoom(delta) {
      fontSizeCorrente = Math.max(12, Math.min(32, fontSizeCorrente + delta));
      document.querySelectorAll('.card-body').forEach(el => el.style.fontSize = fontSizeCorrente + 'px');
      aggiornaStato(`Testo: ${fontSizeCorrente}px`);
    }

    function resetZoom() {
      fontSizeCorrente = 16;
      document.querySelectorAll('.card-body').forEach(el => el.style.fontSize = '16px');
      aggiornaStato('Zoom ripristinato');
    }

    function copiaTesto(lang) {
      const el = document.getElementById('box_' + lang);
      if (!el) return;
      const testo = el.innerText.trim();
      if (!testo || testo === '...') return;
      navigator.clipboard.writeText(testo).then(() => {
        aggiornaStato(`✓ Copiato in ${lang.toUpperCase()}!`);
        setTimeout(() => aggiornaStato('Pronto'), 2000);
      });
    }

    function cancellaTutto() {
      testoConfermatoDocente = '';
      document.getElementById('testoITA').value = '';
      document.getElementById('testoStudente').value = '';
      lingueAttive.forEach(l => {
        const el = document.getElementById('box_' + l);
        if (el) el.innerText = '...';
      });
      aggiornaStato('Schermata pulita');
    }

    function registraModificaManuale() {
      testoConfermatoDocente = document.getElementById('testoITA').value;
      gestisciInput();
    }

    function apriModalitaStudente() { document.getElementById('studentPanel').style.display = 'block'; }
    function chiudiModalitaStudente() {
      document.getElementById('studentPanel').style.display = 'none';
      if (inAscoltoStudente) fermaAscoltoStudente();
    }

    function apriFocus(lang, titoloLingua) {
      linguaFocusCorrente = lang;
      const el = document.getElementById('box_' + lang);
      const testo = el ? el.innerText : '...';
      document.getElementById('modalTitle').innerText = titoloLingua;
      const modalBody = document.getElementById('modalBody');
      modalBody.innerText = testo;
      const langObj = ELENCO_LINGUE.find(l => l.code === lang);
      if (langObj && langObj.rtl) modalBody.classList.add('rtl');
      else modalBody.classList.remove('rtl');
      document.getElementById('modalFocus').style.display = 'flex';
    }

    function chiudiFocus() {
      document.getElementById('modalFocus').style.display = 'none';
      linguaFocusCorrente = null;
    }

    function leggiTestoFocus(velocita) {
      if (linguaFocusCorrente) leggiTesto(linguaFocusCorrente, velocita);
    }

    function salvaInCronologia() {
      const testoITA = document.getElementById('testoITA').value.trim();
      if (!testoITA) return;
      let riga = { ita: testoITA };
      lingueAttive.forEach(l => {
        const el = document.getElementById('box_' + l);
        riga[l] = el ? el.innerText : '...';
      });
      cronologiaLezione.push(riga);
      aggiornaStato(`📌 Frase salvata (${cronologiaLezione.length} totali)`);
    }

    function scaricaLezione() {
      if (cronologiaLezione.length === 0) {
        alert("Nessuna frase salvata.");
        return;
      }
      let contenuto = "VOCABOLARIO LEZIONE CPIA\n=========================\n\n";
      cronologiaLezione.forEach((item, index) => {
        contenuto += `FRASE ${index + 1}:\n🇮🇹 ITA: ${item.ita}\n`;
        lingueAttive.forEach(l => {
          const obj = ELENCO_LINGUE.find(x => x.code === l);
          contenuto += `${obj ? obj.name : l}: ${item[l]}\n`;
        });
        contenuto += "-------------------------\n\n";
      });
      const blob = new Blob([contenuto], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Lezione_CPIA_${new Date().toISOString().slice(0,10)}.txt`;
      link.click();
    }

    let vociDisponibili = [];
    function caricaVoci() {
      if ('speechSynthesis' in window) vociDisponibili = window.speechSynthesis.getVoices();
    }
    caricaVoci();
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = caricaVoci;

    function selezionaVoceMigliore(langCode) {
      if (!vociDisponibili.length) caricaVoci();
      const prefix = langCode.toLowerCase();
      const compatibili = vociDisponibili.filter(v => v.lang.toLowerCase().startsWith(prefix));
      if (!compatibili.length) return null;
      let scelta = compatibili.find(v => v.name.includes('Online') || v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Premium'));
      if (!scelta) scelta = compatibili.find(v => v.name.includes('Google'));
      return scelta || compatibili[0];
    }

    function leggiTesto(lang, velocita = 0.9) {
      const el = document.getElementById('box_' + lang);
      if (!el) return;
      const testo = el.innerText.trim();
      if (!testo || testo === '...') return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(testo);
        const obj = ELENCO_LINGUE.find(l => l.code === lang);
        const langCode = obj ? obj.voice.split('-')[0] : lang;
        const voceMigliore = selezionaVoceMigliore(langCode);
        if (voceMigliore) utterance.voice = voceMigliore;
        utterance.lang = obj ? obj.voice : lang;
        utterance.rate = velocita;
        utterance.onstart = () => aggiornaStato(`Lettura (${lang.toUpperCase()})...`);
        utterance.onend = () => aggiornaStato('Pronto');
        window.speechSynthesis.speak(utterance);
      }
    }

    function applicaPunteggiatura(testo) {
      return testo
        .replace(/\bvirgola\b/gi, ',')
        .replace(/\bpunto e virgola\b/gi, ';')
        .replace(/\bdue punti\b/gi, ':')
        .replace(/\bpunto di domanda\b|\bpunto interrogativo\b/gi, '?')
        .replace(/\bpunto esclamativo\b/gi, '!')
        .replace(/\bpunto\b/gi, '.')
        .replace(/\bnuova linea\b|\ba capo\b/gi, '\n')
        .replace(/\s+([,.?!:;])/g, '$1');
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recDocente = null, inAscoltoDocente = false;

    if (SpeechRecognition) {
      recDocente = new SpeechRecognition();
      recDocente.continuous = true;
      recDocente.interimResults = true;
      recDocente.lang = 'it-IT';

      recDocente.onresult = (e) => {
        let testoProvvisorio = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const transcript = e.results[i][0].transcript;
          if (e.results[i].isFinal) testoConfermatoDocente += (testoConfermatoDocente ? ' ' : '') + transcript;
          else testoProvvisorio += transcript;
        }
        let testoTotale = testoConfermatoDocente + (testoProvvisorio ? ' ' + testoProvvisorio : '');
        document.getElementById('testoITA').value = applicaPunteggiatura(testoTotale);
        gestisciInput();
      };

      recDocente.onerror = () => fermaAscoltoDocente();
      recDocente.onend = () => { if (inAscoltoDocente) recDocente.start(); };
    }

    function toggleMicrofonoDocente() {
      if (!recDocente) return alert("Browser non supportato. Usa Chrome o Edge.");
      if (inAscoltoDocente) fermaAscoltoDocente();
      else avviaAscoltoDocente();
    }

    function avviaAscoltoDocente() {
      if (inAscoltoStudente) fermaAscoltoStudente();
      testoConfermatoDocente = document.getElementById('testoITA').value;
      try {
        recDocente.start();
        inAscoltoDocente = true;
        const btn = document.getElementById('btnMic');
        btn.classList.add('recording');
        document.getElementById('micText').innerText = 'In ascolto...';
        aggiornaStato('Mic Docente attivo');
      } catch (e) { console.error(e); }
    }

    function fermaAscoltoDocente() {
      inAscoltoDocente = false;
      if (recDocente) recDocente.stop();
      const btn = document.getElementById('btnMic');
      btn.classList.remove('recording');
      document.getElementById('micText').innerText = 'Attiva Mic';
      aggiornaStato('Pronto');
    }

    let recStudente = null, inAscoltoStudente = false;
    function toggleMicrofonoStudente() {
      if (!SpeechRecognition) return alert("Browser non supportato.");
      if (inAscoltoStudente) fermaAscoltoStudente();
      else avviaAscoltoStudente();
    }

    function avviaAscoltoStudente() {
      if (inAscoltoDocente) fermaAscoltoDocente();
      const langSel = document.getElementById('studentLangSelect').value;
      recStudente = new SpeechRecognition();
      recStudente.continuous = true;
      recStudente.interimResults = true;
      recStudente.lang = langSel;

      recStudente.onresult = (e) => {
        let t = '';
        for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
        traduciDaStudente(t, langSel.split('-')[0]);
      };
      recStudente.onerror = () => fermaAscoltoStudente();
      recStudente.onend = () => { if (inAscoltoStudente) recStudente.start(); };

      try {
        recStudente.start();
        inAscoltoStudente = true;
        const btn = document.getElementById('btnMicStudent');
        btn.classList.add('recording');
        btn.innerText = '🔴 In ascolto (Studente)...';
        aggiornaStato('Mic Studente attivo');
      } catch (e) { console.error(e); }
    }

    function fermaAscoltoStudente() {
      inAscoltoStudente = false;
      if (recStudente) recStudente.stop();
      const btn = document.getElementById('btnMicStudent');
      btn.classList.remove('recording');
      btn.innerText = '🎙️ Parla (Studente)';
      aggiornaStato('Pronto');
    }

    async function traduciDaStudente(testo, langDa) {
      if (!testo.trim()) return;
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${langDa}&tl=it&dt=t&q=${encodeURIComponent(testo)}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const traduzioneITA = data[0].map(item => item[0]).join('');
        document.getElementById('testoStudente').value = `[${langDa.toUpperCase()}]: ${testo}\n🇮🇹 [TRADUZIONE PER DOCENTE]: ${traduzioneITA}`;
      } catch (e) { console.error(e); }
    }

    function gestisciInput() {
      aggiornaStato('Digitazione...');
      clearTimeout(timerDebounce);
      timerDebounce = setTimeout(traduciTutto, 150);
    }

    async function traduciTutto() {
      const testo = document.getElementById('testoITA').value.trim();

      if (!testo) {
        lingueAttive.forEach(l => {
          const el = document.getElementById('box_' + l);
          if (el) el.innerText = '...';
        });
        aggiornaStato('Pronto');
        return;
      }

      if (abortController) abortController.abort();
      abortController = new AbortController();

      aggiornaStato('Traduzione...');

      let traduzioniMap = {};

      let promesse = lingueAttive.map(lang => {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=${lang}&dt=t&q=${encodeURIComponent(testo)}`;
        return fetch(url, { signal: abortController.signal })
          .then(res => res.json())
          .then(data => {
            const traduzione = data[0].map(item => item[0]).join('');
            const el = document.getElementById('box_' + lang);
            if (el) el.innerText = traduzione;
            if (linguaFocusCorrente === lang) document.getElementById('modalBody').innerText = traduzione;
            traduzioniMap[lang] = traduzione;
          })
          .catch(() => {});
      });

      Promise.all(promesse).then(() => {
        aggiornaStato('Tradotto');
        trasmettiDatiRete({
          ita: testo,
          traduzioni: traduzioniMap
        });
      });
    }

    function aggiornaStato(msg) { document.getElementById('status').innerText = msg; }

    inizializzaGriglia();
    inizializzaRete();
  </script>
</body>
</html>
