<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlaConMe - Accesso Aula CPIA</title>
  
  <link rel="icon" type="image/png" href="logo_bianco.png?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.3);
      --primary: #38bdf8;
      --text: #f8fafc;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0284c7 0%, transparent 60%), var(--bg);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    img.emoji {
      height: 1.2em;
      width: 1.2em;
      margin: 0 .15em 0 .15em;
      vertical-align: -0.2em;
      display: inline-block;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .field-label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: rgba(10, 15, 29, 0.85);
      color: #fff;
      margin-bottom: 18px;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
    }
    input {
      font-size: 22px;
      text-align: center;
      letter-spacing: 3px;
    }
    select {
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #070b14;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
      margin-top: 6px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.7);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>
      <img src="logo_bianco.png?v=4" alt="Logo" style="height: 38px; vertical-align: middle; margin-right: 8px;">
      ParlaConMe
    </h1>
    <p>Inserisci il PIN dell'aula e scegli la tua lingua:</p>
    
    <span class="field-label">🔑 PIN Stanza LIM:</span>
    <input type="text" id="pinInput" placeholder="Es. 1234" maxlength="15" autocomplete="off" onkeypress="gestisciInvio(event)">

    <span class="field-label">🌐 La tua Lingua Madre:</span>
    <select id="langInput" onchange="salvaLinguaPreferita()">
      <!-- Popolato dinamicamente da JS -->
    </select>
    
    <button onclick="connettiAllaStanza()">Entra in Aula ➔</button>
  </div>

  <script>
    const ELENCO_LINGUE = [
      { code: 'sq', name: '🇦🇱 Albanese' },
      { code: 'ar', name: '🇸🇦 Arabo' },
      { code: 'bn', name: '🇧🇩 Bengalese' },
      { code: 'zh-CN', name: '🇨🇳 Cinese' },
      { code: 'fa', name: '🇮🇷 Farsi' },
      { code: 'fr', name: '🇫🇷 Francese' },
      { code: 'hi', name: '🇮🇳 Hindi' },
      { code: 'en', name: '🇬🇧 Inglese' },
      { code: 'ps', name: '🇦🇫 Pashto' },
      { code: 'pt', name: '🇵🇹 Portoghese' },
      { code: 'ro', name: '🇷🇴 Rumeno' },
      { code: 'ru', name: '🇷🇺 Russo' },
      { code: 'es', name: '🇪🇸 Spagnolo' },
      { code: 'tl', name: '🇵🇭 Tagalog' },
      { code: 'de', name: '🇩🇪 Tedesco' },
      { code: 'ti', name: '🇪🇷 Tigrino' },
      { code: 'uk', name: '🇺🇦 Ucraino' },
      { code: 'ur', name: '🇵🇰 Urdu' }
    ];

    function inizializzaPagina() {
      const select = document.getElementById('langInput');
      select.innerHTML = '';
      
      // Carica l'ultima lingua salvata nello smartphone, se presente
      const ultimaLingua = localStorage.getItem('parlaconme_lang') || 'en';

      ELENCO_LINGUE.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.code;
        opt.innerText = l.name;
        if (l.code === ultimaLingua) opt.selected = true;
        select.appendChild(opt);
      });

      if (window.twemoji) {
        twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
      }
    }

    function salvaLinguaPreferita() {
      const lang = document.getElementById('langInput').value;
      localStorage.setItem('parlaconme_lang', lang);
    }

    function connettiAllaStanza() {
      const pin = document.getElementById('pinInput').value.trim();
      const lang = document.getElementById('langInput').value;
      
      if (!pin) {
        alert("Per favore, inserisci il PIN della stanza.");
        return;
      }

      salvaLinguaPreferita();

      const stanzaId = pin.startsWith('cpia-aula-') ? pin : 'cpia-aula-' + pin;
      
      // Reindirizza passando sia la stanza sia la lingua specifica dello studente
      window.location.href = `index.html?stanza=${encodeURIComponent(stanzaId)}&lang=${encodeURIComponent(lang)}`;
    }

    function gestisciInvio(e) {
      if (e.key === 'Enter') {
        connettiAllaStanza();
      }
    }

    window.addEventListener('DOMContentLoaded', inizializzaPagina);
  </script>
</body>
</html>
