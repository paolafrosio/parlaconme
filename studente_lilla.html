<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlaConMe - Accesso Aula CPIA</title>
  <link rel="icon" type="image/png" href="logo_piccolo.png?v=5">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #fde047;
      color: #18181b;
      margin: 0;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ==================== CORNICE SMARTPHONE SU PC (> 520px) ==================== */
    @media (min-width: 521px) {
      body {
        background: #9b72cf; /* Sfondo lilla */
        padding: 16px;
      }

      .phone-shell {
        width: 390px;
        max-width: 390px;
        height: 760px;
        max-height: 94vh;
        background: #fde047;
        border: 14px solid #18181b;
        border-radius: 48px;
        box-shadow: 0 24px 50px rgba(24, 24, 27, 0.45), 0 0 0 3px #3f3f46;
        padding: 32px 18px 22px 18px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .phone-notch-bar {
        display: block;
        width: 145px;
        height: 22px;
        background: #18181b;
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
      }
      .phone-notch-bar::after {
        content: "";
        display: block;
        width: 44px;
        height: 5px;
        background: #3f3f46;
        border-radius: 999px;
        margin: 7px auto 0 auto;
      }
    }

   /* ==================== SCHERMO INTERO SU CELLULARE (<= 520px) ==================== */
    @media (max-width: 520px) {
      body {
        background: #fde047;
        padding: 10px 14px;
        justify-content: flex-start;
      }
      .phone-shell {
        width: 100%;
        max-width: 420px;
        height: calc(100svh - 20px);
        max-height: 620px;
        background: #fde047;
        display: flex;
        flex-direction: column;
      }
      .phone-notch-bar {
        display: none;
      }
      .top-brand {
        margin-bottom: 2px;
      }
      .top-brand img {
        height: 24px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .lang-list-box {
        min-height: 120px;
        padding: 10px 6px 6px 6px;
        gap: 4px;
        margin-bottom: 8px;
      }
      .lang-row {
        padding: 6px 10px;
      }
      .lang-flag {
        width: 38px;
        height: 26px;
      }
      .pin-box {
        padding: 6px 12px;
        margin-bottom: 8px;
      }
      .btn-enter {
        padding: 11px;
        font-size: 15px;
      }
    }

    /* ==================== CONTENUTO SCHERMATA ==================== */
    .login-card {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0 2px 4px 2px;
    }

    .top-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .top-brand img {
      height: 28px;
    }
    .top-brand span {
      font-size: 17px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.2px;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
      font-weight: 900;
      color: #7c3aed;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==================== ELENCO SCORREVOLE LINGUE (POST-IT IRREGOLARE + SCOTCH) ==================== */
    .lang-list-box {
      background: #ffffff;
      border: 2.5px solid #18181b;
      border-radius: 24px 8px 22px 10px / 10px 22px 8px 24px;
      padding: 14px 8px 8px 8px;
      flex-grow: 1;
      min-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      box-shadow: 0 10px 20px rgba(24, 24, 27, 0.18);
      position: relative;
      transform: rotate(-0.35deg);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
    }
    .lang-list-box:hover {
      transform: translateY(-2px) rotate(0.4deg);
      box-shadow: 0 14px 26px rgba(24, 24, 27, 0.24);
    }

    .lang-list-box::-webkit-scrollbar {
      width: 10px;
    }
    .lang-list-box::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
      margin: 8px 0;
    }
    .lang-list-box::-webkit-scrollbar-thumb {
      background: #9b72cf;
      border-radius: 10px;
      border: 2px solid #f1f5f9;
    }

    .lang-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 14px 6px 14px 8px / 8px 14px 6px 14px;
      border: 2px solid transparent;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.12s ease, border-color 0.12s ease;
      flex-shrink: 0;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }

    .lang-row:hover {
      background: #faf5ff;
      border-color: #c4b5fd;
      transform: translateX(3px);
    }

    .lang-row.selected {
      background: #f3e8ff;
      border-color: #7c3aed;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.2);
    }

    .lang-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-flag {
      width: 44px;
      height: 30px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .lang-names {
      display: flex;
      flex-direction: column;
    }

    .lang-native {
      font-size: 16px;
      font-weight: 800;
      color: #18181b;
      line-height: 1.15;
    }

    .lang-ita {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }

    .lang-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: transparent;
      flex-shrink: 0;
    }

    .lang-row.selected .lang-check {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #fde047;
    }

    /* ==================== RIQUADRO PIN SOTTO (IRREGOLARE + OMBRA MORBIDA) ==================== */
    .pin-box {
      background: #ffffff;
      border: 2.5px solid #18181b;
      border-radius: 10px 22px 8px 20px / 20px 8px 22px 10px;
      padding: 8px 14px;
      margin-bottom: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(24, 24, 27, 0.18);
      transform: rotate(0.4deg);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }
    .pin-box:hover {
      transform: translateY(-2px) rotate(-0.5deg);
      box-shadow: 0 12px 22px rgba(24, 24, 27, 0.24);
    }

    .pin-label {
      font-size: 13px;
      font-weight: 900;
      color: #18181b;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .pin-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 22px;
      font-weight: 900;
      color: #7c3aed;
      text-align: right;
      letter-spacing: 3px;
      outline: none;
    }
    .pin-input::placeholder {
      color: #94a3b8;
      font-size: 16px;
      letter-spacing: 1px;
    }

    /* ==================== PULSANTE ENTRA ==================== */
    .btn-enter {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 900;
      color: #fde047;
      background: #7c3aed;
      border: 2.5px solid #18181b;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, box-shadow 0.18s ease;
      box-shadow: 0 8px 18px rgba(24, 24, 27, 0.24);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      font-family: inherit;
    }

    .btn-enter:hover {
      transform: translateY(-2px) rotate(-0.8deg);
      background: #6d28d9;
      box-shadow: 0 12px 24px rgba(24, 24, 27, 0.3);
    }

    .btn-enter:focus-visible, .lang-row:focus-visible {
      outline: 3px solid #7c3aed;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <div class="phone-shell">
    <div class="phone-notch-bar" aria-hidden="true"></div>

    <main class="login-card">
      <div class="top-brand">
        <img src="logo_piccolo.png?v=5" alt="">
        <span>Parla con me</span>
      </div>

      <h1>Cerca la tua lingua</h1>

      <!-- ELENCO SCORREVOLE CON BANDIERA E NOME LINGUA -->
      <div class="lang-list-box" id="langListBox" role="listbox" aria-label="Scegli la tua lingua"></div>

      <!-- RIQUADRO PIN IN BASSO -->
      <div class="pin-box">
        <label class="pin-label" for="pinInput">🔑 PIN Aula:</label>
        <input type="text" id="pinInput" class="pin-input" placeholder="123456" maxlength="25" autocomplete="off" inputmode="numeric" onkeypress="gestisciInvio(event)">
      </div>

      <button class="btn-enter" onclick="connettiAllaStanza()">Entra in Aula ➔</button>
    </main>
  </div>

  <script>
    const ELENCO_LINGUE = [
      { code: 'sq',    flag: 'al', native: 'Shqip',      ita: 'Albanese' },
      { code: 'ar',    flag: 'sa', native: 'العربية',    ita: 'Arabo' },
      { code: 'bn',    flag: 'bd', native: 'বাংলা',      ita: 'Bengalese' },
      { code: 'zh-CN', flag: 'cn', native: '中文',       ita: 'Cinese' },
      { code: 'fa',    flag: 'ir', native: 'فارسی',      ita: 'Farsi' },
      { code: 'fr',    flag: 'fr', native: 'Français',   ita: 'Francese' },
      { code: 'hi',    flag: 'in', native: 'हिन्दी',      ita: 'Hindi' },
      { code: 'en',    flag: 'gb', native: 'English',    ita: 'Inglese' },
      { code: 'ne',    flag: 'np', native: 'नेपाली',     ita: 'Nepalese' },
      { code: 'ps',    flag: 'af', native: 'پښتو',       ita: 'Pashto' },
      { code: 'pt',    flag: 'pt', native: 'Português',  ita: 'Portoghese' },
      { code: 'ro',    flag: 'ro', native: 'Română',     ita: 'Rumeno' },
      { code: 'ru',    flag: 'ru', native: 'Русский',    ita: 'Russo' },
      { code: 'es',    flag: 'es', native: 'Español',    ita: 'Spagnolo' },
      { code: 'tl',    flag: 'ph', native: 'Tagalog',    ita: 'Tagalog' },
      { code: 'de',    flag: 'de', native: 'Deutsch',    ita: 'Tedesco' },
      { code: 'ti',    flag: 'er', native: 'ትግርኛ',       ita: 'Tigrino' },
      { code: 'uk',    flag: 'ua', native: 'Українська', ita: 'Ucraino' },
      { code: 'ur',    flag: 'pk', native: 'اردو',       ita: 'Urdu' }
    ];

    let linguaSelezionata = 'en';

    function inizializzaIstantanea() {
      const urlParams = new URLSearchParams(window.location.search);
      const stanzaDaUrl = urlParams.get('stanza') || urlParams.get('pin');
      if (stanzaDaUrl) {
        document.getElementById('pinInput').value = stanzaDaUrl.replace('cpia-aula-', '').trim();
      }

      try {
        const salvata = localStorage.getItem('parlaconme_lang');
        if (salvata && ELENCO_LINGUE.some(l => l.code === salvata)) {
          linguaSelezionata = salvata;
        }
      } catch (e) {}

      renderizzaListaLingue();
    }

    function renderizzaListaLingue() {
      const container = document.getElementById('langListBox');
      container.innerHTML = '';

      ELENCO_LINGUE.forEach(l => {
        const isSelected = (l.code === linguaSelezionata);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lang-row' + (isSelected ? ' selected' : '');
        btn.setAttribute('role', 'option');
        btn.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        btn.onclick = () => selezionaLingua(l.code);

        btn.innerHTML = `
          <div class="lang-row-left">
            <img class="lang-flag" src="bandiere/${l.flag}.svg" alt="">
            <div class="lang-names">
              <span class="lang-native">${l.native}</span>
              <span class="lang-ita">${l.ita}</span>
            </div>
          </div>
          <span class="lang-check">✓</span>
        `;

        container.appendChild(btn);
      });

      setTimeout(() => {
        const activeEl = container.querySelector('.lang-row.selected');
        if (activeEl) {
          activeEl.scrollIntoView({ block: 'nearest' });
        }
      }, 50);
    }

    function selezionaLingua(code) {
      linguaSelezionata = code;
      try { localStorage.setItem('parlaconme_lang', code); } catch (e) {}
      renderizzaListaLingue();
    }

    function connettiAllaStanza() {
      const pin = document.getElementById('pinInput').value.trim();

      if (!pin) {
        alert("Per favore, inserisci il PIN della stanza.");
        document.getElementById('pinInput').focus();
        return;
      }

      try { localStorage.setItem('parlaconme_lang', linguaSelezionata); } catch (e) {}
      const stanzaId = pin.startsWith('cpia-aula-') ? pin : 'cpia-aula-' + pin;
      window.location.href = `index_lilla.html?stanza=${encodeURIComponent(stanzaId)}&lang=${encodeURIComponent(linguaSelezionata)}`;
    }

    function gestisciInvio(e) {
      if (e.key === 'Enter') connettiAllaStanza();
    }

    inizializzaIstantanea();
  </script>
</body>
</html>
