<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlaConMe - Accesso Aula CPIA</title>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.3);
      --primary: #38bdf8;
      --text: #f8fafc;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0284c7 0%, transparent 60%), var(--bg);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: var(--primary);
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 3px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: rgba(10, 15, 29, 0.8);
      color: #fff;
      margin-bottom: 18px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #070b14;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.7);
    }
  </style>
</head>
<body>

  <div class="login-card">
<h1>
  <img src="logo_bianco.png?v=4" alt="Logo" style="height: 38px; vertical-align: middle; margin-right: 8px;">
  ParlaConMe
</h1>
    <p>Inserisci il PIN della stanza mostrato sulla LIM dal docente:</p>
    
    <input type="text" id="pinInput" placeholder="Es. 1234" maxlength="15" autocomplete="off" onkeypress="gestisciInvio(event)">
    <button onclick="connettiAllaStanza()">Entra in Aula ➔</button>
  </div>

  <script>
    function connettiAllaStanza() {
      const inputEl = document.getElementById('pinInput');
      let pin = inputEl.value.trim();
      
      if (!pin) {
        alert("Per favore, inserisci il PIN della stanza.");
        return;
      }

      // Normalizza il PIN inserito
      const stanzaId = pin.startsWith('cpia-aula-') ? pin : 'cpia-aula-' + pin;
      
      // Reindirizza a index.html passando la stanza nell'URL
      window.location.href = 'index.html?stanza=' + encodeURIComponent(stanzaId);
    }

    function gestisciInvio(e) {
      if (e.key === 'Enter') {
        connettiAllaStanza();
      }
    }
  </script>
</body>
</html>
