<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlaConMe - Accesso Aula CPIA</title>
  <link rel="icon" type="image/png" href="logo_piccolo.png?v=5">

  <script defer src="https://cdn.jsdelivr.net/npm/@twemoji/api@15/dist/twemoji.min.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #d4ff00;
      color: #111111;
      margin: 0;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    img.emoji {
      height: 1.2em;
      width: 1.2em;
      margin: 0 .15em;
      vertical-align: -0.2em;
      display: inline-block;
    }

    /* ==================== CORNICE SMARTPHONE SU PC (> 520px) ==================== */
    @media (min-width: 521px) {
      body {
        background: #c81d25; /* Sfondo rosso CPIAPERTE */
        padding: 24px 16px;
      }

      .phone-shell {
        width: 390px;
        max-width: 390px;
        height: 780px;
        max-height: 92vh;
        background: #d4ff00;
        border: 14px solid #111111;
        border-radius: 48px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55), 0 0 0 3px #333333;
        padding: 38px 18px 20px 18px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .phone-notch-bar {
        display: block;
        width: 145px;
        height: 22px;
        background: #111111;
        border-bottom-left-radius: 15px;
        border-bottom-right-radius: 15px;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
      }
      .phone-notch-bar::after {
        content: "";
        display: block;
        width: 44px;
        height: 5px;
        background: #333333;
        border-radius: 999px;
        margin: 7px auto 0 auto;
      }
    }

    /* ==================== SCHERMO INTERO SU CELLULARE (<= 520px) ==================== */
    @media (max-width: 520px) {
      body {
        background: #d4ff00;
        padding: 16px;
      }
      .phone-shell {
        width: 100%;
        max-width: 420px;
        background: #d4ff00;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .phone-notch-bar {
        display: none;
      }
    }

    /* ==================== CONTENUTO INTERNO LOGIN ==================== */
    .login-card {
      background: #d4ff00;
      padding: 10px 6px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      font-weight: 900;
      color: #c81d25;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    p {
      color: #111111;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 20px 0;
    }

    .field-box {
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      text-align: left;
    }

    .field-label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 800;
      border: 2px solid #111111;
      border-radius: 12px;
      background: #ffffff;
      color: #111111;
      outline: none;
      font-family: inherit;
    }

    input {
      font-size: 24px;
      text-align: center;
      letter-spacing: 3px;
      color: #c81d25;
    }

    select {
      font-size: 16px;
      cursor: pointer;
    }

    input:focus, select:focus, button:focus-visible {
      outline: 3px solid #c81d25;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 900;
      color: #d4ff00;
      background: #c81d25;
      border: 3px solid #111111;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 4px 0 #111111;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-2px);
      background: #a6141b;
    }
  </style>
</head>
<body>

  <div class="phone-shell">
    <div class="phone-notch-bar" aria-hidden="true"></div>

    <main class="login-card">
      <h1>
        <img src="logo_piccolo.png?v=5" alt="" style="height: 36px; vertical-align: middle; margin-right: 8px;">
        Parla con me
      </h1>
      <p>Inserisci il PIN dell'aula e scegli la tua lingua:<br><span style="font-size: 12px; opacity: 0.85;">Enter the classroom PIN and choose your language:</span></p>

      <div class="field-box">
        <label class="field-label" for="pinInput">🔑 PIN Stanza LIM:</label>
        <input type="text" id="pinInput" placeholder="Es. 123456" maxlength="25" autocomplete="off" inputmode="numeric" onkeypress="gestisciInvio(event)">
      </div>

      <div class="field-box">
        <label class="field-label" for="langInput">🌐 La tua Lingua Madre:</label>
        <select id="langInput" onchange="salvaLinguaPreferita()"></select>
      </div>

      <button onclick="connettiAllaStanza()">Entra in Aula ➔</button>
    </main>
  </div>

  <script>
    const ELENCO_LINGUE = [
      { code: 'sq', name: 'Albanese' },
      { code: 'ar', name: 'Arabo' },
      { code: 'bn', name: 'Bengalese' },
      { code: 'zh-CN', name: 'Cinese' },
      { code: 'fa', name: 'Farsi' },
      { code: 'fr', name: 'Francese' },
      { code: 'hi', name: 'Hindi' },
      { code: 'en', name: 'Inglese' },
      { code: 'ne', name: 'Nepalese' },
      { code: 'ps', name: 'Pashto' },
      { code: 'pt', name: 'Portoghese' },
      { code: 'ro', name: 'Rumeno' },
      { code: 'ru', name: 'Russo' },
      { code: 'es', name: 'Spagnolo' },
      { code: 'tl', name: 'Tagalog' },
      { code: 'de', name: 'Tedesco' },
      { code: 'ti', name: 'Tigrino' },
      { code: 'uk', name: 'Ucraino' },
      { code: 'ur', name: 'Urdu' }
    ];

    function inizializzaIstantanea() {
      const urlParams = new URLSearchParams(window.location.search);
      const stanzaDaUrl = urlParams.get('stanza') || urlParams.get('pin');
      if (stanzaDaUrl) {
        document.getElementById('pinInput').value = stanzaDaUrl.replace('cpia-aula-', '').trim();
      }

      const select = document.getElementById('langInput');
      select.innerHTML = '';
      let ultimaLingua = 'en';
      try { ultimaLingua = localStorage.getItem('parlaconme_lang') || 'en'; } catch (e) {}

      ELENCO_LINGUE.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.code;
        opt.innerText = l.name;
        if (l.code === ultimaLingua) opt.selected = true;
        select.appendChild(opt);
      });

      setTimeout(() => {
        if (window.twemoji) twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
      }, 50);
    }

    function salvaLinguaPreferita() {
      try { localStorage.setItem('parlaconme_lang', document.getElementById('langInput').value); } catch (e) {}
    }

    function connettiAllaStanza() {
      const pin = document.getElementById('pinInput').value.trim();
      const lang = document.getElementById('langInput').value;

      if (!pin) {
        alert("Per favore, inserisci il PIN della stanza.");
        return;
      }
      salvaLinguaPreferita();
      const stanzaId = pin.startsWith('cpia-aula-') ? pin : 'cpia-aula-' + pin;
      window.location.href = `indexcolore.html?stanza=${encodeURIComponent(stanzaId)}&lang=${encodeURIComponent(lang)}`;
    }

    function gestisciInvio(e) {
      if (e.key === 'Enter') connettiAllaStanza();
    }

    inizializzaIstantanea();
  </script>
</body>
</html>
